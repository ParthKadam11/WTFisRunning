version: 2

project_name: wtf

before:
  hooks:
    - go mod tidy

builds:
  - id: wtf
    main: ./cmd/wtf
    binary: wtf
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: default
    ids:
      - wtf
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: ParthKadam11
    name: WTFisRunning
  extra_files:
    - glob: ./install.sh
      name_template: i
    - glob: ./install.ps1
      name_template: i.ps1

homebrew_casks:
  - name: wtf
    ids:
      - default
    homepage: "https://github.com/ParthKadam11/WTFisRunning"
    description: "See what the fuck is actually running on your Linux server"
    binaries:
      - wtf
    directory: Casks
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/wtf"]
          end
    repository:
      owner: ParthKadam11
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew cask update for wtf {{ .Tag }}"
    url:
      template: "https://github.com/ParthKadam11/WTFisRunning/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
